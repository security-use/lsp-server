[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-lsp"
version = "0.1.0"
description = "LSP server for security vulnerability highlighting in VS Code/Cursor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "security-use" }
]
keywords = ["lsp", "security", "vulnerabilities", "vscode", "cursor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pygls>=1.3.0",
    "lsprotocol>=2023.0.1",
]

[project.optional-dependencies]
scanner = [
    "security-use>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
security-lsp = "security_lsp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/security_lsp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
